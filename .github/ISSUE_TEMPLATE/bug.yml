name: Bug report
description: Something shows the wrong number, does not start, or breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste real usage records, logs, prompts or screenshots with your own projects in them. Describe what you saw instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Computer
      options: [Mac, Windows PC, Both with a second computer]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version`, and your macOS or Windows version.
  - type: textarea
    id: setup
    attributes:
      label: Setup output
      description: The lines `npm run setup` printed, with any personal paths removed.
