name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Compile the menu bar app
        if: runner.os == 'macOS'
        run: xcrun swiftc -O -swift-version 5 glance/mac/Glance.swift -o "$RUNNER_TEMP/ObservatoryGlance"
      - name: Compile the tray app with the C# compiler built into Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ "/out:$env:RUNNER_TEMP\ObservatoryGlance.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll glance\windows\Glance.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
