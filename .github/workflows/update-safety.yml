name: Desktop update safety
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/*installation*.test.mjs'
      - 'scripts/replace-payload.test.mjs'
      - 'scripts/mac-replacement.test.mjs'
      - 'scripts/mac-package.test.mjs'
      - 'scripts/update-appcast.test.mjs'
      - 'scripts/sparkle-interop.test.mjs'
      - '.github/workflows/update-safety.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/*installation*.test.mjs'
      - 'scripts/replace-payload.test.mjs'
      - 'scripts/mac-replacement.test.mjs'
      - 'scripts/mac-package.test.mjs'
      - 'scripts/update-appcast.test.mjs'
      - 'scripts/sparkle-interop.test.mjs'
      - '.github/workflows/update-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dependency-free tests create only disposable keys and synthetic payloads.
      # This workflow neither builds releases nor accesses production signing keys.
      - name: Verify signatures, replacement and rollback
        run: node --test scripts/verify-installation.test.mjs scripts/replace-payload.test.mjs scripts/mac-replacement.test.mjs scripts/mac-package.test.mjs scripts/update-appcast.test.mjs
      - name: Verify official Sparkle signing interoperability
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/Sparkle.tar.xz"
          url="$(node -p "require('./native/mac/updater-tool.json').url")"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 134217728 "$url" --output "$archive"
          node --input-type=module - "$archive" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const pin=JSON.parse(readFileSync('native/mac/updater-tool.json','utf8'));
          const actual=createHash('sha256').update(readFileSync(process.argv[2])).digest('hex');
          if(actual!==pin.sha256)throw Error('Official Sparkle archive checksum mismatch');
          NODE
          tar -xf "$archive" -C "$tool_dir" ./bin/sign_update ./LICENSE
          OBSERVATORY_TEST_SPARKLE_TOOL="$tool_dir/bin/sign_update" node --test scripts/sparkle-interop.test.mjs
