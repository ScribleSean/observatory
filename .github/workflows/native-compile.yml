name: Native compilation
on:
  push:
    branches: [main]
    paths: ['native/**', 'scripts/verify-installation.test.mjs', '.github/workflows/native-compile.yml']
  pull_request:
    paths: ['native/**', 'scripts/verify-installation.test.mjs', '.github/workflows/native-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore native/windows/WorkspaceObservatory.csproj --locked-mode -r win-x64
      - name: Compile self-contained native test binary
        run: dotnet publish native/windows/WorkspaceObservatory.csproj -c Release -r win-x64 --self-contained true --no-restore -o native-test
      - name: Run isolated native contracts
        shell: pwsh
        run: |
          $test = Start-Process -FilePath ./native-test/WorkspaceObservatory.exe -ArgumentList '--self-test' -PassThru -NoNewWindow
          if (-not $test.WaitForExit(60000)) {
            $test.Kill()
            throw 'Native self-test timed out.'
          }
          if ($test.ExitCode -ne 0) { throw 'Native self-test failed.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify native updater script integration
        shell: pwsh
        run: |
          $app = (Resolve-Path native-test).Path
          $runtime = Join-Path $app 'Runtime'
          New-Item -ItemType Directory -Path $runtime -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination (Join-Path $runtime 'node.exe')
          $env:OBSERVATORY_TEST_UPDATE_EXTRACTOR = Join-Path $app 'WorkspaceObservatory.exe'
          try {
            node --test scripts/verify-installation.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Native updater script integration failed.' }
          } finally { Remove-Item Env:OBSERVATORY_TEST_UPDATE_EXTRACTOR }
      - name: Verify synthetic Windows dashboard navigation
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'observatory-dashboard-fixture'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $test = Start-Process -FilePath ./native-test/WorkspaceObservatory.exe -ArgumentList @('--test-native-dashboard', $output) -PassThru -NoNewWindow
          if (-not $test.WaitForExit(60000)) {
            $test.Kill()
            throw 'Synthetic dashboard test timed out.'
          }
          $result = Join-Path $output 'native-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($test.ExitCode -ne 0) { throw 'Synthetic dashboard test failed.' }
          if ((Get-Content (Join-Path $output 'native-result.txt') -Raw).Trim() -ne 'native-dashboard: passed') {
            throw 'Synthetic dashboard result missing or failed.'
          }
      - name: Retain fictional dashboard screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-windows-dashboard
          path: ${{ runner.temp }}/observatory-dashboard-fixture/*.png
          retention-days: 1
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Swift sources
        shell: bash
        run: |
          mkdir -p native-test/module-cache
          xcrun swiftc -swift-version 5 -O -module-cache-path native-test/module-cache \
            -target "$(uname -m)-apple-macosx14.0" \
            -framework AppKit -framework SwiftUI -framework WebKit -framework ServiceManagement \
            native/*.swift -o native-test/WorkspaceObservatory
      - name: Run isolated native contracts
        run: native-test/WorkspaceObservatory --self-test
      - name: Compile fail-closed UI preview
        shell: bash
        run: |
          xcrun swiftc -swift-version 5 -D OBSERVATORY_PREVIEW_ONLY \
            -module-cache-path native-test/module-cache \
            -target "$(uname -m)-apple-macosx14.0" \
            -framework AppKit -framework SwiftUI -framework WebKit -framework ServiceManagement \
            native/*.swift -o native-test/ObservatoryPreview
      - name: Reject unsafe preview launches
        run: node native/verify-preview-guard.mjs native-test/ObservatoryPreview
      # No app installation, live sources or release artifacts. Windows UI uses fictional fixtures only.
