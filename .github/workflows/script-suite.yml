name: Script suite
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'app/**'
      - 'native/web/**'
      - 'native/**/*.mjs'
      - 'native/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/script-suite.yml'
      - 'native/BridgeContract.swift'
      - 'native/windows/BridgeContract.cs'
      - 'native/Strings.swift'
      - 'native/windows/Strings.cs'
      - 'native/DesignTokens.swift'
      - 'native/windows/DesignTokens.cs'
      - 'native/prices.json'
      - 'native/design-tokens.json'
      - 'native/skins/**'
      - 'native/windows/runtime-assets.ps1'
      - 'native/windows/runtime-assets.json'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'app/**'
      - 'native/web/**'
      - 'native/**/*.mjs'
      - 'native/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/script-suite.yml'
      - 'native/BridgeContract.swift'
      - 'native/windows/BridgeContract.cs'
      - 'native/Strings.swift'
      - 'native/windows/Strings.cs'
      - 'native/DesignTokens.swift'
      - 'native/windows/DesignTokens.cs'
      - 'native/prices.json'
      - 'native/design-tokens.json'
      - 'native/skins/**'
      - 'native/windows/runtime-assets.ps1'
      - 'native/windows/runtime-assets.json'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: script-suite-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            part: general
          - os: windows-latest
            part: tls-1
          - os: windows-latest
            part: tls-2
          - os: windows-latest
            part: tls-3
          - os: windows-latest
            part: tls-4
          - os: windows-latest
            part: tls-5
          - os: windows-latest
            part: sync-1
          - os: windows-latest
            part: sync-2
          - os: windows-latest
            part: sync-3
          - os: macos-14
            part: general
          - os: macos-14
            part: tls
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the account volume for private-state fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temporary = Join-Path $env:LOCALAPPDATA ('WorkspaceObservatoryBuild/ci-script-suite-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temporary | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$temporary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - name: Export selected Python
        shell: node {0}
        env:
          OBSERVATORY_PYTHON: ${{ steps.python.outputs.python-path }}
          OBSERVATORY_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          const { appendFileSync } = require('node:fs');
          const path = require('node:path');
          for (const key of ['OBSERVATORY_PYTHON', 'OBSERVATORY_TEST_PYTHON']) {
            const python = process.env[key];
            if (!python || !path.isAbsolute(python) || /[\r\n\0]/.test(python)) {
              throw new Error('Source tests require an absolute Python executable');
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}=${python}\n`);
          }
      - name: Install pinned time zone data on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./native/windows/runtime-assets.ps1
          $cache = Join-Path $env:LOCALAPPDATA 'WorkspaceObservatoryBuild/cache'
          $timezone = Get-ObservatoryArchive -Name tzdata -CacheRoot $cache
          & $env:OBSERVATORY_PYTHON -B -m pip install --no-index --no-deps $timezone
          if ($LASTEXITCODE -ne 0) { throw 'Pinned timezone preparation failed.' }
      - run: npm ci
      - name: Exclude test tools from Defender scans and warm Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath (Split-Path $env:OBSERVATORY_PYTHON), $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE -ErrorAction Stop
            Add-MpPreference -ExclusionProcess $env:OBSERVATORY_PYTHON, (Get-Command node).Source -ErrorAction Stop
          } catch {
            echo "::warning::Could not configure Defender exclusions. Continuing with Python warm-up."
          }
          & $env:OBSERVATORY_PYTHON -I -S -B -c "import sys"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full script suite
        shell: node {0}
        env:
          SUITE_PART: ${{ matrix.part }}
        run: |
          const { readdirSync, readFileSync } = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const part = process.env.SUITE_PART;
          // Windows groups use measured durations from runs 38821008546 and 38828778891. The plan uses the longest time seen per file.
          const shards = {
            'tls-1': ['peer-tls-trust.test.mjs'],
            'tls-2': ['peer-repair.test.mjs', 'peer-pairing.test.mjs'],
            'tls-3': ['peer-tls-repair.test.mjs', 'quota-tls.test.mjs', 'peer-tls-service.test.mjs', 'peer-tls-control.test.mjs'],
            'tls-4': ['peer-setup.test.mjs', 'provider-token-tls.test.mjs'],
            'tls-5': ['quota-sync.test.mjs', 'peer-tls-client.test.mjs', 'peer-tls-sync.test.mjs'],
          };
          const syncNames = {
            'sync-1': [
              'local hours stay on the dashboard while stored and exchanged records remain identical',
              'pairing revoke, corruption and retirement fence transport while local disable remains available',
              'wrong identity, older, conflicting and regressing revisions cannot replace a peer record',
              'native sharing CLI exposes only bounded status and confirmation fields',
            ],
            'sync-2': [
              'duplicate deliveries keep source and receipt time, newer snapshots replace instead of sum',
              'disable or disable-reenable during readiness prevents sending provider readings',
              'collection off disables sharing and failed reads replace totals with Unknown',
              'concurrent TLS roles exchange without holding a network lock and preserve local collection on errors',
            ],
          };
          const syncFile = 'provider-token-sync.test.mjs';
          const tls = Object.values(shards).flat();
          const names = Object.values(syncNames).flat();
          const validParts = process.platform === 'win32'
            ? [...Object.keys(shards), 'sync-1', 'sync-2', 'sync-3'] : ['tls'];
          const refuse = (message) => { console.error(message); process.exit(1); };
          if (new Set(names).size !== names.length) refuse('Duplicate sync test name');
          const tlsPatterns = [
            /^peer-tls-.*\.test\.mjs$/,
            /^peer-(pairing|repair|setup)\.test\.mjs$/,
            /^provider-token-(sync|tls)\.test\.mjs$/,
            /^quota-(sync|tls)\.test\.mjs$/,
          ];
          const isTls = (name) => tlsPatterns.some((pattern) => pattern.test(name));
          if (new Set(tls).size !== tls.length) {
            console.error('Duplicate TLS test file across shards');
            process.exit(1);
          }
          if (part !== 'general' && !validParts.includes(part)) {
            console.error('SUITE_PART must be general or one of: ' + validParts.join(', '));
            process.exit(1);
          }
          const files = readdirSync('scripts', { withFileTypes: true })
            .filter((entry) => entry.isFile() && entry.name.endsWith('.test.mjs'))
            .map((entry) => entry.name)
            .sort();
          for (const name of [...tls, syncFile]) {
            if (!files.includes(name)) {
              console.error(`Missing TLS test file: ${name}`);
              process.exit(1);
            }
          }
          shards['tls-3'].push(...files.filter((name) => isTls(name) && !tls.includes(name) && name !== syncFile));
          const isSync = part.startsWith('sync-');
          if (isSync) {
            let source;
            try { source = readFileSync(`scripts/${syncFile}`, 'utf8'); }
            catch { refuse('Unable to read provider sync test file'); }
            for (const name of names) {
              if (source.split("test('" + name + "'").length - 1 !== 1) {
                refuse(`Expected exactly one top-level sync test: ${name}`);
              }
            }
          }
          const selected = isSync ? [syncFile] : part === 'tls' ? files.filter(isTls) : shards[part];
          const batches = part !== 'general' ? selected.map((name) => [name]) : [files.filter((name) => !isTls(name))];
          const args = ['--import', './native/tests/test-source-runtime.mjs', '--test'];
          args.push(part !== 'general' ? '--test-timeout=900000' : '--test-timeout=300000');
          if (part !== 'general' || process.platform === 'darwin') args.push('--test-concurrency=1');
          if (isSync) {
            const escape = (name) => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const flag = part === 'sync-3' ? '--test-skip-pattern' : '--test-name-pattern';
            for (const name of (part === 'sync-3' ? names : syncNames[part])) args.push(`${flag}=^${escape(name)}$`);
          }
          for (const batch of batches) {
            const result = spawnSync(process.execPath, [...args, ...batch.map((name) => `scripts/${name}`)], { stdio: 'inherit' });
            if (result.error) console.error(result.error);
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
      - name: Run Windows test isolation checks
        shell: node {0}
        env:
          SUITE_PART: ${{ matrix.part }}
        run: |
          if (process.env.SUITE_PART !== 'general') process.exit(0);
          const { spawnSync } = require('node:child_process');
          const result = spawnSync(process.execPath, ['--test', 'native/tests/windows-test-isolation.test.mjs'], { stdio: 'inherit' });
          if (result.error) console.error(result.error);
          if (result.status !== 0) process.exit(result.status ?? 1);
      - run: npx tsc --noEmit
        if: matrix.part == 'general'
      - name: oxlint (advisory until the earlier web dashboard is removed)
        if: matrix.part == 'general'
        continue-on-error: true
        run: npx oxlint
      - run: node scripts/build-design-tokens.mjs --check
        if: matrix.part == 'general'
