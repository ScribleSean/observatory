name: Isolated Windows pairing timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Read diagnostic instrumentation
        uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - name: Read unchanged build 35 source
        uses: actions/checkout@v4
        with:
          ref: ced669854940f5892570a6a7a8feb1689b903b80
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run only the unchanged pairing lifecycle test once
        shell: pwsh
        run: |
          $expected = 'ced669854940f5892570a6a7a8feb1689b903b80'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          if ((git -C $source rev-parse HEAD).Trim() -ne $expected) { throw 'Unexpected test source revision.' }
          if (git -C $source status --porcelain) { throw 'Test source must be clean.' }
          $builder = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $builder -PathType Leaf)) { throw 'Configured build Python is missing.' }
          $preload = (Resolve-Path 'diagnostic/scripts/peer-pairing-timing-preload.mjs').Path
          $trace = Join-Path $env:RUNNER_TEMP 'pairing-timing.jsonl'
          $testLog = Join-Path $env:RUNNER_TEMP 'pairing-test-output.txt'
          if (Test-Path -LiteralPath $trace) { throw 'Diagnostic trace must be fresh.' }
          $env:OBSERVATORY_TEST_PYTHON = $builder
          $env:OBSERVATORY_PAIRING_TRACE_FILE = $trace
          $env:OBSERVATORY_PAIRING_TRACE_ORIGIN = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString()
          $env:NODE_OPTIONS = '--import="' + ([Uri]::new($preload)).AbsoluteUri + '"'
          $testExit = 1
          Push-Location $source
          try {
            & node --test --test-reporter=tap --test-name-pattern='^normal native CLI loads pairing, publishes local state and merges a validated peer$' scripts/peer-pairing.test.mjs *> $testLog
            $testExit = $LASTEXITCODE
          } finally {
            Pop-Location
            Remove-Item Env:NODE_OPTIONS, Env:OBSERVATORY_PAIRING_TRACE_FILE, Env:OBSERVATORY_PAIRING_TRACE_ORIGIN, Env:OBSERVATORY_TEST_PYTHON
            if (Test-Path -LiteralPath $trace) { Get-Content -LiteralPath $trace }
            if (Test-Path -LiteralPath $testLog) {
              Get-Content -LiteralPath $testLog | Where-Object { $_ -match '^# (tests|pass|fail|cancelled|skipped|duration_ms) [0-9.]+$' }
            }
          }
          if (git -C $source status --porcelain) { throw 'Diagnostic changed the frozen test source.' }
          if (-not (Test-Path -LiteralPath $trace)) { throw 'Diagnostic trace missing.' }
          if ($testExit -ne 0) { throw 'The unchanged pairing test failed or timed out.' }
