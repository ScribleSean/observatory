name: Clean Windows package
on:
  workflow_dispatch:
    inputs:
      verify_compiler_only:
        description: Verify only the pinned installer compiler download, without executing it
        type: boolean
        default: false
      verify_installer:
        description: Compile and exercise the isolated test-identity installer
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the account volume for private-state fixtures
        if: '!inputs.verify_compiler_only'
        shell: pwsh
        run: |
          $temporary = Join-Path $env:LOCALAPPDATA ('WorkspaceObservatoryBuild/ci-package-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temporary | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$temporary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Verify the compiler archive without executing downloaded content
        if: inputs.verify_compiler_only
        shell: pwsh
        run: ./native/windows/test-installer-download.ps1
      - uses: actions/setup-dotnet@v4
        if: '!inputs.verify_compiler_only'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        if: '!inputs.verify_compiler_only'
        with:
          python-version: '3.13'
      - name: Require a passing script suite on this commit
        if: '!inputs.verify_compiler_only'
        shell: node {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (async () => {
            const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_TOKEN } = process.env;
            const refuse = () => {
              console.error(`No successful Script suite run (push or manual dispatch) exists for ${GITHUB_SHA}. Dispatch Script suite on this commit, wait for it to pass, then run this workflow again.`);
              process.exit(1);
            };
            if (![GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_TOKEN].every(Boolean)) return refuse();
            let response;
            try {
              response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/script-suite.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100`, {
                headers: {
                  Authorization: `Bearer ${GITHUB_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
            } catch {
              console.error('Script suite lookup failed.');
              process.exit(1);
            }
            if (!response.ok) {
              console.error(`Script suite lookup returned HTTP ${response.status}.`);
              process.exit(1);
            }
            let data;
            try {
              data = await response.json();
              if (!Array.isArray(data?.workflow_runs)) throw new Error();
            } catch {
              console.error('Script suite lookup returned malformed JSON.');
              process.exit(1);
            }
            const run = data.workflow_runs.find((run) => run?.head_sha === GITHUB_SHA &&
              run.status === 'completed' && run.conclusion === 'success' &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.head_repository?.full_name === GITHUB_REPOSITORY);
            if (!run) return refuse();
            console.log(`Accepted Script suite run ${run.id}: ${run.html_url}`);
          })();
      - name: Exclude build tools from Defender scans
        if: '!inputs.verify_compiler_only'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, (Split-Path -Parent (Get-Command node).Source) -ExclusionProcess 'node.exe', 'powershell.exe' -ErrorAction Stop
          } catch {
            Write-Output '::warning::Could not exclude build tools from Defender scans. Continuing with the build.'
          }
      - name: Build and verify complete package from a clean checkout
        if: '!inputs.verify_compiler_only'
        shell: pwsh
        run: |
          $builder = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $builder -PathType Leaf)) { throw 'Configured build Python is missing.' }
          . ./native/windows/runtime-assets.ps1
          $cache = Join-Path $env:LOCALAPPDATA 'WorkspaceObservatoryBuild/cache'
          $timezone = Get-ObservatoryArchive -Name tzdata -CacheRoot $cache
          & $builder -B -m pip install --no-index --no-deps $timezone
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build timezone preparation failed.' }
          $env:OBSERVATORY_TEST_PYTHON = $builder
          ./native/windows/package.ps1 -BuildPython $builder -SkipScriptSuite
      - name: Compile and verify the isolated installer lifecycle
        id: candidate
        if: inputs.verify_installer && !inputs.verify_compiler_only
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'native/windows/release'
          $packages = @(Get-ChildItem -LiteralPath $release -Directory -Filter 'candidate-*' | ForEach-Object {
            $app = Join-Path $_.FullName 'Workspace Observatory'
            if (Test-Path -LiteralPath (Join-Path $app 'package-manifest.json')) { $app }
          })
          if ($packages.Count -ne 1) { throw 'Expected exactly one clean-run package.' }
          $app = $packages[0]
          & (Join-Path $app 'Runtime/node.exe') native/windows/verify-manifest.mjs $app
          if ($LASTEXITCODE -ne 0) { throw 'Clean package verification failed.' }
          $env:OBSERVATORY_TEST_UPDATE_EXTRACTOR = Join-Path $app 'WorkspaceObservatory.exe'
          try {
            & (Join-Path $app 'Runtime/node.exe') --test scripts/verify-installation.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Signed update archive regression failed.' }
          } finally { Remove-Item Env:OBSERVATORY_TEST_UPDATE_EXTRACTOR }
          ./native/windows/installer.ps1 -PackageDirectory $app -TestIdentity
          ./native/windows/test-installer-download.ps1
          $receipts = @(Get-ChildItem -LiteralPath $release -Directory -Filter 'installer-*' | ForEach-Object {
            $receipt = Join-Path $_.FullName 'artifacts/installer-build.json'
            if (Test-Path -LiteralPath $receipt) { $receipt }
          })
          if ($receipts.Count -ne 1) { throw 'Expected exactly one installer build receipt.' }
          $receipt = Get-Content -LiteralPath $receipts[0] -Raw | ConvertFrom-Json
          if (-not $receipt.testIdentity) { throw 'Only the isolated test identity is permitted.' }
          $installer = Join-Path (Split-Path $receipts[0]) $receipt.installerName
          ./native/windows/test-installer.ps1 -InstallerPath $installer
          ./native/windows/verify-update-staging.ps1 -PackageDirectory $app
          $output = Join-Path $env:RUNNER_TEMP 'observatory-windows-retained'
          $retained = & (Join-Path $app 'Runtime/node.exe') native/windows/retain-candidate.mjs $release $output $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Verified candidate retention failed.' }
          $identity = $retained | ConvertFrom-Json
          "build_number=$($identity.buildNumber)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Retain verified ordinary Windows installer
        if: success() && inputs.verify_installer && !inputs.verify_compiler_only
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-installer-build${{ steps.candidate.outputs.build_number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-windows-retained/installer/
          retention-days: 1
          if-no-files-found: error
      - name: Retain verified independent Windows package
        if: success() && inputs.verify_installer && !inputs.verify_compiler_only
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-package-build${{ steps.candidate.outputs.build_number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-windows-retained/package/
          retention-days: 1
          if-no-files-found: error
      - name: Diagnose private-directory failure with a disposable fixture
        if: failure() && !inputs.verify_compiler_only
        shell: pwsh
        run: |
          $fixture = Join-Path $env:TEMP ('observatory-acl-diagnostic-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $directory = Join-Path $fixture 'private-sync'
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/private-sync-acl.ps1 -Directory $directory -Initialize -Diagnostic
          exit $LASTEXITCODE
      # A temporary ordinary installation is verified and removed on this clean runner.
      # No live sources, signing secrets or publication.
      # A packaged build is not a clean first-launch or desktop usability test.
