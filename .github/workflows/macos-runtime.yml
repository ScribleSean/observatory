name: Clean Mac runtime
on:
  workflow_dispatch:
    inputs:
      build_app:
        description: Build and verify the complete app and ZIP after runtime preparation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime preparation contracts
        run: python3 -B -m unittest discover -s native/mac -p 'test_prepare_runtime.py'
      - name: Fetch pinned runtime archives into a new cache
        env:
          OBSERVATORY_RUNTIME_CACHE: ${{ runner.temp }}/observatory-runtime-cache
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.parse
          cache = pathlib.Path(os.environ['OBSERVATORY_RUNTIME_CACHE'])
          cache.mkdir()
          assets = json.loads(pathlib.Path('native/mac/runtime-assets.json').read_text())
          for asset in assets.values():
              name = asset['filename']
              if pathlib.Path(name).name != name or '\\' in name:
                  raise ValueError('Invalid archive filename')
              url = urllib.parse.urlsplit(asset['url'])
              node = url.hostname == 'nodejs.org' and url.path.startswith('/dist/')
              python = url.hostname == 'github.com' and url.path.startswith('/astral-sh/python-build-standalone/releases/download/')
              if url.scheme != 'https' or url.username or url.password or not (node or python):
                  raise ValueError('Unexpected runtime origin')
              target = cache / name
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--max-time', '180',
                  '--retry', '2', '--output', str(target), asset['url']], check=True, timeout=600)
              if hashlib.sha256(target.read_bytes()).hexdigest() != asset['sha256']:
                  raise ValueError('Runtime checksum mismatch')
          PY
      - name: Prepare verified redistributable runtime
        env:
          OBSERVATORY_RUNTIME_CACHE: ${{ runner.temp }}/observatory-runtime-cache
          OBSERVATORY_RUNTIME_OUTPUT: ${{ runner.temp }}/observatory-runtime.tar.gz
        run: python3 -B native/mac/prepare-runtime.py --cache "$OBSERVATORY_RUNTIME_CACHE" --output "$OBSERVATORY_RUNTIME_OUTPUT"
      - uses: actions/setup-node@v4
        if: inputs.build_app
        with:
          node-version: '22.23.2'
      - name: Build complete Apple Silicon application
        if: inputs.build_app
        env:
          OBSERVATORY_RUNTIME_DIR: ${{ runner.temp }}/observatory-runtime
          OBSERVATORY_RUNTIME_ARCHIVE: ${{ runner.temp }}/observatory-runtime.tar.gz
        run: |
          test "$(uname -m)" = arm64
          mkdir "$OBSERVATORY_RUNTIME_DIR"
          tar -xzf "$OBSERVATORY_RUNTIME_ARCHIVE" -C "$OBSERVATORY_RUNTIME_DIR"
          npm ci --no-audit --no-fund
          node scripts/build-brand.mjs
          npm test
          node native/build.mjs --runtime-dir "$OBSERVATORY_RUNTIME_DIR"
      - name: Verify distributable ZIP and extracted app
        if: inputs.build_app
        env:
          OBSERVATORY_PACKAGE_OUTPUT: ${{ runner.temp }}/observatory-package
        run: |
          bundle=$(node -p "require('./.native-build/app.json').bundle")
          node native/mac/package.mjs --bundle "$bundle" --output "$OBSERVATORY_PACKAGE_OUTPUT" --zip-only
      # Runtime-only mode does not execute downloaded binaries. The opt-in full
      # build runs isolated native checks. No publication, live collection,
      # application installation or production signing keys are involved.
